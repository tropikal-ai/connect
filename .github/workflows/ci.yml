name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A new push supersedes the in-flight run for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checkout.
permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts -p 'test_release_package.py' -v

  quality:
    uses: ./.github/workflows/php-quality.yml

  # Single stable check for branch protection: "CI green" fails when any
  # quality job failed, was cancelled, or was skipped.
  ci:
    name: CI green
    if: always()
    needs: [quality, release-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All quality jobs passed."
